name: Import verified city generator
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-city.yml']
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: TrentSterling/punk
          ref: 6420c88506862f1c0e13622e48ec044616de5819
          path: _source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: |
          mkdir -p /tmp/punkcity-deps
          cd /tmp/punkcity-deps
          npm init -y
          npm install --ignore-scripts three@0.180.0 playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Relocate source and assets
        run: python3 tools/migrate_from_punk.py _source/citylab . /tmp/punkcity-deps/node_modules/three
      - name: Verify generator and offline build
        run: |
          node --check citylab.js
          node --check districts.js
          node test-districts.mjs
          node check_locomotion.mjs
          python3 build_standalone.py
          mkdir -p /tmp/punkcity-preview
          ln -s "$GITHUB_WORKSPACE" /tmp/punkcity-preview/punkcity
          python3 -m http.server 8080 --directory /tmp/punkcity-preview >/tmp/punkcity-http.log 2>&1 &
          NODE_PATH=/tmp/punkcity-deps/node_modules node qa-v02.cjs
      - name: Commit migrated app
        run: |
          git config user.name 'Trent'
          git config user.email 'trentsterling@gmail.com'
          git add .nojekyll .gitignore CONTRIBUTING.md MIGRATION.json README.md REFERENCE-STUDY.md index.html citylab.js districts.js build_standalone.py check_locomotion.mjs test-districts.mjs qa-v02.cjs HACKERPUNK-Citylab-v0.2.html archive vendor
          git commit -m 'Move HACKERPUNK city generator to punkcity with relative assets'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: punkcity-migration-checks
          path: |
            qa-v02/
            MIGRATION.json
            HACKERPUNK-Citylab-v0.2.html
          retention-days: 30
