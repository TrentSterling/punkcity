name: Punkcity checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: punkcity-checks
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: |
          mkdir -p /tmp/punkcity-deps
          cd /tmp/punkcity-deps
          npm init -y
          npm install --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test geometry, starter access, relative hosting and offline build
        run: |
          node --check citylab.js
          node --check districts.js
          node --check urbanism.js
          node --check facades.js
          node test-urbanism.mjs
          node check_locomotion.mjs
          python3 build_standalone.py
          git diff --exit-code -- HACKERPUNK-Citylab-v0.3.html
          mkdir -p /tmp/punkcity-preview
          ln -s "$GITHUB_WORKSPACE" /tmp/punkcity-preview/punkcity
          python3 -m http.server 8080 --directory /tmp/punkcity-preview >/tmp/punkcity-http.log 2>&1 &
          NODE_PATH=/tmp/punkcity-deps/node_modules node qa-v03.cjs
      - name: Verify deployed Pages URL
        run: NODE_PATH=/tmp/punkcity-deps/node_modules node tools/smoke-live.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: punkcity-verification
          path: qa-v03/
          retention-days: 30
