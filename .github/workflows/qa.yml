name: Punkcity checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: punkcity-checks
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify geometry, surface ownership and starter access
        run: |
          for f in citylab.js districts.js urbanism.js scifi.js geometry-batch.js surface-ownership.js placement.js prop-kit.js frontage.js street-services.js roof-services.js; do node --check "$f"; done
          node --expose-gc test-infill.mjs
          node --expose-gc test-surfaces.mjs
          node --expose-gc test-grounding.mjs
          node check_locomotion.mjs
          python3 build_standalone.py
          git diff --exit-code -- HACKERPUNK-Citylab-v0.5.html
      - name: Install browser test dependency
        run: |
          mkdir -p /tmp/punkcity-deps
          cd /tmp/punkcity-deps
          npm init -y
          npm install --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test relative hosting, generator isolation and offline build
        run: |
          mkdir -p /tmp/punkcity-preview
          ln -s "$GITHUB_WORKSPACE" /tmp/punkcity-preview/punkcity
          python3 -m http.server 8080 --directory /tmp/punkcity-preview >/tmp/punkcity-http.log 2>&1 &
          NODE_PATH=/tmp/punkcity-deps/node_modules node qa-v05.cjs
      - name: Verify deployed Pages URL and source hashes
        run: NODE_PATH=/tmp/punkcity-deps/node_modules node tools/smoke-live.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: punkcity-verification
          path: qa-v05/
          retention-days: 30
