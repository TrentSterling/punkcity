name: Punkcity checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: punkcity-checks
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify inhabited places, architecture, streets and surfaces
        run: |
          for f in *.js; do node --check "$f"; done
          node --expose-gc test-places.mjs
          node --expose-gc test-retrofit.mjs
          node --expose-gc test-variety.mjs
          node --expose-gc test-infill.mjs
          node --expose-gc test-streets.mjs
          node --expose-gc test-neighborhoods.mjs
          node --expose-gc test-grounding.mjs
          node --expose-gc test-surfaces.mjs
          node check_locomotion.mjs
          python3 build_standalone.py
          git diff --exit-code -- HACKERPUNK-Citylab-v0.10.html
      - name: Install browser verifier
        run: |
          mkdir -p /tmp/punkcity-deps
          cd /tmp/punkcity-deps
          npm init -y
          npm install --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Compare criticism views and verify controls and offline build
        run: |
          mkdir -p /tmp/punkcity-preview
          ln -s "$GITHUB_WORKSPACE" /tmp/punkcity-preview/punkcity
          python3 -m http.server 8080 --directory /tmp/punkcity-preview >/tmp/punkcity-http.log 2>&1 &
          NODE_PATH=/tmp/punkcity-deps/node_modules node qa-inhabited.cjs
          NODE_PATH=/tmp/punkcity-deps/node_modules node qa-v10.cjs
      - name: Verify deployed module hashes, places and night lighting
        run: NODE_PATH=/tmp/punkcity-deps/node_modules node tools/smoke-live.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: punkcity-verification
          path: |
            qa-v10/
            qa-v09/*.json
            qa-v08/*.json
            qa-v07/*.json
            qa-v06/*.json
          retention-days: 30
