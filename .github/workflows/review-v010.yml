name: Punkcity inhabited city review
on:
  push:
    branches: [iteration/inhabited-city-v010]
    paths: ['.github/workflows/review-v010.yml', 'places.js', 'inhabited-facades.js', 'place-lighting.js', 'qa-inhabited.cjs', 'tools/integrate-inhabited-v010.py']
permissions:
  contents: write
concurrency:
  group: punkcity-inhabited-review
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate and preserve complete source
        run: |
          if grep -q "VERSION='0.9.0'" citylab.js; then python3 tools/integrate-inhabited-v010.py; fi
          python3 build_standalone.py
          git config user.name 'Trent'
          git config user.email 'trentsterling@gmail.com'
          git add '*.js' index.html build_standalone.py qa-v10.cjs qa-variety.cjs qa-retrofit.cjs HACKERPUNK-Citylab-v0.10.html
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate human-scale facades, occupied places and local light pools'
            git push origin HEAD:iteration/inhabited-city-v010
          fi
      - name: Verify places, routes and final meshes
        run: |
          for f in *.js; do node --check "$f"; done
          node --expose-gc test-places.mjs
          node --expose-gc test-infill.mjs
          node --expose-gc test-streets.mjs
          node --expose-gc test-variety.mjs
          node --expose-gc test-neighborhoods.mjs
          node --expose-gc test-grounding.mjs
          node --expose-gc test-retrofit.mjs
          node --expose-gc test-surfaces.mjs
          node check_locomotion.mjs
      - name: Install browser verifier
        run: |
          mkdir -p /tmp/punkcity-deps
          cd /tmp/punkcity-deps
          npm init -y
          npm install --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Review matched cameras and test viewer
        run: |
          mkdir -p /tmp/punkcity-preview
          ln -s "$GITHUB_WORKSPACE" /tmp/punkcity-preview/punkcity
          python3 -m http.server 8080 --directory /tmp/punkcity-preview >/tmp/punkcity-http.log 2>&1 &
          NODE_PATH=/tmp/punkcity-deps/node_modules node qa-inhabited.cjs
          NODE_PATH=/tmp/punkcity-deps/node_modules node qa-v10.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: punkcity-v010-review
          path: |
            qa-v10/
            qa-v09/*.json
            qa-v08/*.json
            qa-v07/*.json
            qa-v06/*.json
            HACKERPUNK-Citylab-v0.10.html
          retention-days: 30
