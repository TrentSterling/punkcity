name: Punkcity sci-fi architecture review
on:
  push:
    branches: [iteration/scifi-architecture-v04]
    paths: ['tools/anchor-scifi-v04.py']
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Anchor the reviewed mechanical details
        run: python3 tools/anchor-scifi-v04.py
      - name: Verify geometry and starter traversal
        run: |
          node --check scifi.js
          node test-scifi.mjs
          python3 build_standalone.py
      - name: Install browser verifier
        run: |
          mkdir -p /tmp/punkcity-deps
          cd /tmp/punkcity-deps
          npm init -y
          npm install --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Render districts and check offline build
        run: |
          mkdir -p /tmp/punkcity-preview
          ln -s "$GITHUB_WORKSPACE" /tmp/punkcity-preview/punkcity
          python3 -m http.server 8080 --directory /tmp/punkcity-preview >/tmp/punkcity-http.log 2>&1 &
          NODE_PATH=/tmp/punkcity-deps/node_modules node qa-v04.cjs
      - name: Save verified details
        run: |
          git config user.name 'Trent'
          git config user.email 'trentsterling@gmail.com'
          git add scifi.js HACKERPUNK-Citylab-v0.4.html
          git commit -m 'Support mechanical crowns and anchor service cables clear of upper routes'
          git push origin HEAD:iteration/scifi-architecture-v04
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: punkcity-v04-review
          path: |
            qa-v04/
            HACKERPUNK-Citylab-v0.4.html
            *.js
            *.mjs
            *.cjs
            index.html
            build_standalone.py
          retention-days: 30
