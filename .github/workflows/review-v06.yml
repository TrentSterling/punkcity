name: Integrate and review Punkcity 0.6
on:
  push:
    branches: [iteration/neighborhood-expansion-v06]
    paths: ['tools/integrate-v06.py', '.github/workflows/review-v06.yml']
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate and verify exact source and standalone
        run: python3 tools/integrate-v06.py
      - name: Save complete source before verification
        run: |
          git config user.name 'Trent'
          git config user.email 'trentsterling@gmail.com'
          git add citylab.js districts.js urbanism.js scifi.js placement.js prop-kit.js frontage.js street-services.js roof-services.js index.html build_standalone.py test-infill.mjs test-surfaces.mjs test-grounding.mjs HACKERPUNK-Citylab-v0.6.html
          git commit -m 'Integrate v0.6 neighborhood expansion and exact standalone build'
          git push origin HEAD:iteration/neighborhood-expansion-v06
      - name: Verify geometry, surfaces, grounding and starter movement
        run: |
          node --expose-gc test-infill.mjs
          node --expose-gc test-surfaces.mjs
          node --expose-gc test-grounding.mjs
          node --expose-gc test-neighborhoods.mjs
          node check_locomotion.mjs
      - name: Install browser test dependency
        run: |
          mkdir -p /tmp/punkcity-deps
          cd /tmp/punkcity-deps
          npm init -y
          npm install --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify viewer and offline build
        run: |
          mkdir -p /tmp/punkcity-preview
          ln -s "$GITHUB_WORKSPACE" /tmp/punkcity-preview/punkcity
          python3 -m http.server 8080 --directory /tmp/punkcity-preview >/tmp/punkcity-http.log 2>&1 &
          NODE_PATH=/tmp/punkcity-deps/node_modules node qa-v06.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: punkcity-v06-review
          path: |
            qa-v06/
            HACKERPUNK-Citylab-v0.6.html
          retention-days: 30
