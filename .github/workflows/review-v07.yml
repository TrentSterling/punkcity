name: Punkcity street review
on:
  push:
    branches: [iteration/streets-v07]
    paths: ['streets.js', 'tools/integrate-streets-v07.py', 'tools/align-street-edges.py', 'test-streets.mjs', 'qa-streets.cjs', '.github/workflows/review-v07.yml']
permissions:
  contents: write
concurrency:
  group: punkcity-street-review
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate and preserve source
        run: |
          python3 tools/integrate-streets-v07.py
          python3 tools/align-street-edges.py
          node --check streets.js
          node --check citylab.js
          node --check districts.js
          python3 build_standalone.py
          git config user.name 'Trent'
          git config user.email 'trentsterling@gmail.com'
          git add streets.js citylab.js districts.js index.html build_standalone.py qa-v07.cjs HACKERPUNK-Citylab-v0.7.html
          if ! git diff --cached --quiet; then
            git commit -m 'Align curb boundaries to street skeleton and rebuild offline viewer'
            git push origin HEAD:iteration/streets-v07
          fi
      - name: Validate streets and existing city geometry
        run: |
          node --expose-gc test-streets.mjs
          node --expose-gc test-infill.mjs > /tmp/infill.log
          node --expose-gc test-surfaces.mjs > /tmp/surfaces.log
          node --expose-gc test-grounding.mjs
          node check_locomotion.mjs
          cp qa-v06/geometry.json qa-v06/surfaces.json qa-v06/grounding.json qa-v07/
      - name: Install browser verifier
        run: |
          mkdir -p /tmp/punkcity-deps
          cd /tmp/punkcity-deps
          npm init -y
          npm install --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Street-level render review and viewer regression
        run: |
          mkdir -p /tmp/punkcity-preview
          ln -s "$GITHUB_WORKSPACE" /tmp/punkcity-preview/punkcity
          python3 -m http.server 8080 --directory /tmp/punkcity-preview >/tmp/punkcity-http.log 2>&1 &
          NODE_PATH=/tmp/punkcity-deps/node_modules node qa-streets.cjs
          NODE_PATH=/tmp/punkcity-deps/node_modules node qa-v07.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: punkcity-v07-review
          path: |
            qa-v07/
            HACKERPUNK-Citylab-v0.7.html
            streets.js
            citylab.js
            districts.js
          retention-days: 30
