name: Punkcity cyberpunk retrofit review
on:
  push:
    branches: [iteration/cyberpunk-retrofit-v09]
permissions:
  contents: write
concurrency:
  group: punkcity-retrofit-review
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate and preserve complete source
        run: |
          python3 tools/integrate-retrofit-v09.py
          python3 build_standalone.py
          git config user.name 'Trent'
          git config user.email 'trentsterling@gmail.com'
          git add districts.js citylab.js geometry-batch.js index.html build_standalone.py README.md qa-v09.cjs tools/smoke-live.cjs HACKERPUNK-Citylab-v0.9.html
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate facade retrofit layer, inspection controls and offline viewer'
            git push origin HEAD:iteration/cyberpunk-retrofit-v09
          fi
      - name: Verify sockets, routes, surfaces and unchanged city systems
        run: |
          node --check retrofit.js
          node --check citylab.js
          node --expose-gc test-retrofit.mjs
          node --expose-gc test-infill.mjs
          node --expose-gc test-surfaces.mjs
          node --expose-gc test-grounding.mjs
          node --expose-gc test-streets.mjs
          node --expose-gc test-variety.mjs
          node check_locomotion.mjs
      - name: Install browser verification
        run: |
          mkdir -p /tmp/punkcity-deps
          cd /tmp/punkcity-deps
          npm init -y
          npm install --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Compare street views and verify the viewer
        run: |
          mkdir -p /tmp/punkcity-preview
          ln -s "$GITHUB_WORKSPACE" /tmp/punkcity-preview/punkcity
          python3 -m http.server 8080 --directory /tmp/punkcity-preview >/tmp/punkcity-http.log 2>&1 &
          NODE_PATH=/tmp/punkcity-deps/node_modules node qa-retrofit.cjs
          NODE_PATH=/tmp/punkcity-deps/node_modules node qa-v09.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: punkcity-v09-review
          path: |
            qa-v09/
            qa-v06/
            qa-v07/
            qa-v08/
            HACKERPUNK-Citylab-v0.9.html
          retention-days: 30
